name: Telegram push notification

on:
  push:
    branches:
      - alpha

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram notification
        env:
          BITRIX_USER_ID: ${{secrets.BITRIX_USER_ID}}
          BITRIX_TOKEN: ${{ secrets.BITRIX_TOKEN }}
          BITRIX_DIALOG_ID: ${{ secrets.BITRIX_DIALOG_ID }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
        run: |
          SHORT_SHA="${COMMIT_SHA:0:7}"
          MESSAGE=$(printf 'New commit in alpha\n%s: %s\nBy: %s\n%s' \
            "$SHORT_SHA" "$COMMIT_MESSAGE" "$COMMIT_AUTHOR" "$COMMIT_URL")
          # curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
          curl -s -X POST "https://crm.minta24.ru/rest/${BITRIX_USER_ID}/${BITRIX_TOKEN}/im.message.add.json" \
            --data-urlencode "DIALOG_ID=${BITRIX_DIALOG_ID}" \
            --data-urlencode "MESSAGE=${MESSAGE}"
